<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>MCAxOLL | Event Check-In</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #687386;
      --accent: #3157d5;
      --accent-dark: #2444b2;
      --paper: #ffffff;
      --line: #e6eaf0;
      --surface: #f4f6fa;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--surface); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 15% 0%, rgba(49,87,213,.10), transparent 38rem),
        radial-gradient(ellipse at 100% 100%, rgba(25,145,130,.08), transparent 34rem),
        var(--surface);
    }
    .page { width: min(100% - 36px, 920px); margin: 0 auto; padding: 34px 0 28px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 26px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: .92rem; font-weight: 750; letter-spacing: .045em; }
    .brand-mark {
      display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px;
      color: white; background: var(--ink); font-size: .82rem; letter-spacing: -.04em;
    }
    .event-label { color: var(--muted); font-size: .78rem; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; }
    .intro { text-align: center; margin: 0 auto 25px; max-width: 650px; }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: .76rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.35rem); line-height: 1.06; letter-spacing: -.055em; }
    .subtitle { max-width: 510px; margin: 14px auto 0; color: var(--muted); font-size: 1.02rem; line-height: 1.6; }
    .form-shell {
      overflow: hidden; border: 1px solid rgba(220,225,234,.95); border-radius: 20px;
      background: var(--paper); box-shadow: 0 18px 55px rgba(26,39,70,.09);
    }
    .form-heading {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 17px 22px; border-bottom: 1px solid var(--line);
    }
    .form-heading strong { font-size: .92rem; }
    .secure-note { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: .76rem; }
    .secure-note svg { flex: none; }
    .form-frame { min-height: 620px; padding: 4px 12px 14px; }
    iframe { display: block; width: 100%; min-height: 616px; border: 0; background: transparent; }
    .fallback { padding: 18px 22px 24px; text-align: center; color: var(--muted); font-size: .88rem; }
    .fallback a { color: var(--accent); font-weight: 700; text-decoration: none; }
    .fallback a:hover { text-decoration: underline; }
    footer { padding: 22px 8px 0; text-align: center; color: #8a93a3; font-size: .75rem; }
    @media (max-width: 600px) {
      .page { width: min(100% - 20px, 920px); padding-top: 18px; }
      .topbar { margin-bottom: 30px; }
      .brand { font-size: .8rem; }
      .brand-mark { width: 36px; height: 36px; border-radius: 11px; }
      .event-label { font-size: .65rem; }
      .intro { margin-bottom: 20px; }
      .subtitle { font-size: .93rem; }
      .form-shell { border-radius: 15px; }
      .form-heading { padding: 14px 16px; }
      .form-frame { padding: 2px 4px 10px; min-height: 620px; }
      iframe { min-height: 616px; }
      .secure-note { font-size: .68rem; }
    }
  </style>
</head>
<body>
  <main class="page">

    <section class="form-shell" aria-label="Event form">
      <div class="form-frame">
        <iframe
          data-tally-src="https://tally.so/embed/4a7MJk?alignLeft=1&amp;hideTitle=1&amp;transparentBackground=1&amp;dynamicHeight=1"
          loading="lazy"
          height="616"
          title="MCAxOLL event form"
          allow="camera; microphone; autoplay; encrypted-media;"
        ></iframe>
      </div>
      <div class="fallback">
        Having trouble viewing the form?
        <a href="https://tally.so/r/4a7MJk" target="_blank" rel="noopener noreferrer">Open it in a new tab</a>.
      </div>
    </section>

    <footer>Thank you for being here.</footer>
  </main>

  <script>
    (function () {
      var d = document;
      var src = "https://tally.so/widgets/embed.js";
      function loadTally() {
        if (typeof Tally !== "undefined") {
          Tally.loadEmbeds();
        } else {
          d.querySelectorAll('iframe[data-tally-src]:not([src])').forEach(function (frame) {
            frame.src = frame.dataset.tallySrc;
          });
        }
      }
      if (typeof Tally !== "undefined") {
        loadTally();
      } else if (!d.querySelector('script[src="' + src + '"]')) {
        var script = d.createElement("script");
        script.src = src;
        script.onload = loadTally;
        script.onerror = loadTally;
        d.body.appendChild(script);
      }
    })();
  </script>
</body>
</html>
